name: DroidView
options:
  bundleIdPrefix: com.arley
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  DroidView:
    type: application
    platform: macOS
    sources:
      - path: DroidView
        excludes:
          - Resources/scrcpy-server
      - path: DroidView/Resources/scrcpy-server
        buildPhase: resources
    info:
      path: DroidView/Info.plist
      properties:
        CFBundleDisplayName: DroidView
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: "DroidView — espelhamento Android nativo"
        NSLocalNetworkUsageDescription: "O DroidView procura dispositivos Android com depuração sem fio ativada na sua rede local."
        NSBonjourServices:
          - _adb-tls-pairing._tcp
          - _adb-tls-connect._tcp
          - _adb._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arley.DroidView
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SCRCPY_SERVER_VERSION: "5.0.1"
    postBuildScripts:
      - name: Bundle adb
        script: "\"${PROJECT_DIR}/scripts/bundle-adb.sh\""
        basedOnDependencyAnalysis: false
